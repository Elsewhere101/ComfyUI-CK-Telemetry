name: Publish to Comfy registry
on:
  push:
    branches: [ main ]
    paths: [ "pyproject.toml" ]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{pat-283cec68-128f-41b7-b1ec-4539e77f6194}}
